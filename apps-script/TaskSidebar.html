<!DOCTYPE html>
<html><head><base target="_top"><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>

.download{margin-top:10px;color:var(--blue);background:#fff}.upload{margin-top:10px;padding:16px;border:1px dashed #94a3b8;border-radius:8px;background:#f8fafc}.upload input{padding:7px;background:#fff}
.help{margin:7px 0;color:#64748b;font-size:11px}.summary{margin:10px 0;padding:9px;border-radius:6px;background:#f8fafc;color:#475569}

.message{display:none;margin:0 0 12px;padding:10px;border-radius:6px}.message.error{display:block;color:var(--danger);background:#fde2e2}.message.success{display:block;color:var(--success);background:#ddf4e4}
.actions{position:sticky;bottom:0;padding-top:12px;background:#fff}button{width:100%;border:1px solid var(--blue);border-radius:7px;padding:11px;color:#fff;background:var(--blue);font-weight:700;cursor:pointer}button:disabled{opacity:.5}.note{padding:9px;border-radius:6px;color:#475569;background:#eaf2ff;font-size:11px}
.combo{position:relative}.combo-menu{display:none;position:absolute;z-index:20;top:42px;left:0;right:0;max-height:230px;overflow:auto;border:1px solid #94a3b8;border-radius:7px;background:#fff;box-shadow:0 8px 22px rgba(15,23,42,.16)}.combo-menu.open{display:block}.combo-option{padding:10px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}.combo-option:hover{color:#1d4ed8;background:#eff6ff}.combo-empty{padding:12px;color:#94a3b8}
</style></head><body><form id="intakeForm" onsubmit="return false"><input id="payloadJson" name="payloadJson" type="hidden">
<h1>신규 Listing 요청</h1><p class="subtitle">표준 양식을 내려받아 작성한 뒤 파일을 업로드하세요.</p>
<div class="section"><div class="section-title">1. 요청 양식 다운로드</div>
<div class="template-grid">
<label class="template-card"><span><input type="radio" name="templateFamily" value="3P" checked>3P Listing</span><small>사이즈·색상은 단일값 또는 쉼표로 여러 값을 입력할 수 있습니다.</small></label>
<label class="template-card"><span><input type="radio" name="templateFamily" value="2P">2P Lite</span><small>윙 파일을 그대로 업로드하세요. data 시트만 유지하면 참고용 시트는 자유롭게 추가할 수 있습니다. 필요하면 예비 양식을 내려받으세요.</small></label>
</div>
<button id="downloadButton" type="button" class="download" onclick="downloadTemplate()">3P 표준양식 다운로드 (.xlsx)</button></div>
<div class="section"><div class="section-title">2. 요청정보 작성</div>
<div class="field"><label for="requester">요청자 *</label><input id="requester"></div><div class="grid">
<div><label for="brand">브랜드 *</label><div id="brandCombo" class="combo"><input id="brand" autocomplete="off" placeholder="브랜드명 검색"><div id="brandMenu" class="combo-menu"><div id="brandOptions"></div></div></div></div>
<div><label for="priority">우선순위 *</label><select id="priority"><option value="NORMAL">NORMAL</option></select></div>
<div><label for="node">Node *</label><select id="node"><option value="">불러오는 중...</option></select></div>
<div><label for="aCode">A코드</label><select id="aCode" disabled><option value="">Node를 먼저 선택하세요</option></select></div>
<div><label for="requestType">요청 유형 *</label><select id="requestType"><option value="">요청 유형 선택</option><option value="3P Listing">3P Listing</option><option value="2P Lite 전환">2P Lite 전환</option><option value="3P Listing 후 2P Lite 전환">3P Listing 후 2P Lite 전환</option></select></div>
<div id="sourceField"><label for="source">Source *</label><input id="source"></div>
<div class="wide"><label for="notes">비고</label><textarea id="notes"></textarea></div></div>
</div>
<div class="section"><div class="section-title">3. 요청양식 업로드</div>
<div id="crawlChoice" class="field" style="display:none"><label>3P 자료 준비 방식 *</label><div class="template-grid"><label class="template-card"><span><input type="radio" name="crawlMode" value="standard" onchange="resetUpload();updateRequestTypeUi();renderPreview()">표준양식 업로드</span><small>업로드 즉시 VI를 생성합니다.</small></label><label class="template-card"><span><input type="radio" name="crawlMode" value="crawl" onchange="resetUpload();updateRequestTypeUi();renderPreview()">크롤링 필요</span><small>자유 양식을 접수하고 크롤링 완료 후 VI를 확정합니다.</small></label></div></div>
<div class="upload"><label for="fileInput">작성한 파일 업로드 *</label><input id="fileInput" name="originalUpload" type="file" accept=".xlsx,.xls,.csv,.tsv"></div>
<div id="summary" class="summary">업로드한 파일이 없습니다.</div><div id="viLimitMessage" class="message" role="alert" style="white-space:pre-line"></div><div id="previewWrap" class="preview-wrap"><table><thead><tr id="previewHead"></tr></thead><tbody id="previewBody"><tr><td>미리보기 없음</td></tr></tbody></table></div></div>
<div class="actions"><div id="message" class="message"></div><button id="submitButton" type="button" onclick="submitAll()" disabled>요청 + Task 생성</button></div></form>
<script>
var parsedItems=[],parseErrors=[],uploadedFileName='',originalFile=null,A_CODES_BY_NODE={},BRANDS=[],SELECTED_BRAND='';
var schema3P=[['productCode','품번'],['productName','등록상품명'],['size','사이즈'],['color','색상'],['salePrice','판매가'],['discountPrice','정상가']];
var schema2P=[['vendorProductId','업체상품 ID'],['productId','Product ID'],['option3pId','옵션 ID'],['barcode','바코드'],['vendorProductCode','업체상품코드'],['coupangDisplayName','쿠팡 노출 상품명'],['vendorRegisteredName','업체 등록 상품명'],['registeredOptionName','등록 옵션명']];
function schema(){return document.getElementById('requestType').value==='2P Lite 전환'?schema2P:schema3P}
function selectedTemplateFamily(){var el=document.querySelector('input[name="templateFamily"]:checked');return el?el.value:'3P'}
function crawlRequired(){var el=document.querySelector('input[name="crawlMode"]:checked');return !!el&&el.value==='crawl'}
function crawlModeSelected(){return !!document.querySelector('input[name="crawlMode"]:checked')}
function setMessage(text,type){var b=document.getElementById('message');b.textContent=text||'';b.className=text?'message '+type:'message'}
function priceText(v){return String(v == null?'':v).trim()}
function splitOptions(v){return String(v == null?'':v).split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean)}
function escapeRegExp(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function headerValue(row,label,aliases){var keys=Object.keys(row),labels=[label].concat(aliases||[]).map(function(v){return String(v).replace(/\s/g,'').toLowerCase()});for(var i=0;i<keys.length;i++){if(labels.indexOf(String(keys[i]).replace(/\s/g,'').toLowerCase())>=0)return row[keys[i]]}return ''}
function resetUpload(){document.getElementById('fileInput').value='';parsedItems=[];parseErrors=[];uploadedFileName='';originalFile=null;setMessage('','');renderPreview()}
function updateRequestTypeUi(){var type=document.getElementById('requestType').value,is2P=type==='2P Lite 전환',has3P=!!type&&!is2P;document.getElementById('sourceField').style.display=is2P?'none':'';document.getElementById('crawlChoice').style.display=has3P?'block':'none';if(is2P){document.getElementById('source').value='';document.querySelectorAll('input[name="crawlMode"]').forEach(function(x){x.checked=false})}document.getElementById('fileInput').disabled=has3P&&!crawlModeSelected();document.getElementById('previewWrap').style.display=crawlRequired()?'none':''}
function templateHeaders(){return schema3P.map(function(x){return x[1]})}
function updateTemplateFamilyUi(){var is2P=selectedTemplateFamily()==='2P';document.getElementById('downloadButton').textContent=is2P?'2P Lite 요청 양식 다운로드 (.xlsx)':'3P 표준양식 다운로드 (.xlsx)'}
function downloadTemplate(){
  if(typeof XLSX==='undefined'){setMessage('엑셀 모듈을 불러오지 못했습니다. 팝업을 다시 열어 주세요.','error');return}
  var is2P=selectedTemplateFamily()==='2P';
  if(!is2P){google.script.run.withSuccessHandler(downloadBase64Template).withFailureHandler(function(e){setMessage(e.message||String(e),'error')}).getThreePTemplateDownloadV2();return}
  var headers=['업체상품 ID','Product ID','옵션 ID','상품상태','바코드','업체상품코드','쿠팡 노출 상품명','업체 등록 상품명','등록 옵션명'];
  var wb=XLSX.utils.book_new();var input=XLSX.utils.aoa_to_sheet([['사용하지 않는 영역입니다. 데이터는 3행 헤더 아래부터 입력하세요.'],[],headers]);input['!merges']=[{s:{r:0,c:0},e:{r:1,c:8}}];input['A1'].s={alignment:{horizontal:'center',vertical:'center'},font:{bold:true,color:{rgb:'666666'}},fill:{fgColor:{rgb:'E7E9ED'}}};var barcode=XLSX.utils.aoa_to_sheet([['바코드 체계 및 참고사항'],[],['형식 제한 없이 이미지, 표, 설명, 링크 등을 자유롭게 작성하세요. 이 시트는 데이터로 변환하지 않고 업로드 원본에서 직접 확인합니다.']]);input['!cols']=headers.map(function(h){return {wch:Math.max(14,h.length+4)}});barcode['!cols']=[{wch:90}];XLSX.utils.book_append_sheet(wb,input,'data');XLSX.utils.book_append_sheet(wb,barcode,'바코드 체계 및 참고사항');
  XLSX.writeFile(wb,'2P_Lite_요청_양식.xlsx');
}
function downloadBase64Template(file){var binary=atob(file.base64),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);var url=URL.createObjectURL(new Blob([bytes],{type:file.mimeType})),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function findUploadHeaderRow(ws){var is2P=document.getElementById('requestType').value==='2P Lite 전환';if(is2P){var labels=['A3','B3','C3'].map(function(address){var cell=ws[address]||{},value=cell.w!==undefined?cell.w:cell.v;return String(value==null?'':value).replace(/\s/g,'').toLowerCase()});if(labels[0]==='업체상품id'&&labels[1]==='productid'&&['옵션id','3p옵션id'].indexOf(labels[2])>=0)return 2;throw new Error('2P Lite 파일의 3행 A~I 헤더를 확인해 주세요.')}var grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});for(var i=0;i<Math.min(grid.length,30);i++){var labels=grid[i].map(function(v){return String(v||'').replace(/\s/g,'').toLowerCase()});if(['품번','등록상품명','사이즈','색상','판매가','정상가'].every(function(v){return labels.indexOf(v)>=0}))return i}throw new Error('요청 목록에서 필수 헤더 행을 찾지 못했습니다.')}
function readTwoPUploadRows(ws){var lastRow=3;Object.keys(ws).forEach(function(address){if(address.charAt(0)==='!')return;var cell=ws[address]||{},value=cell.w!==undefined?cell.w:cell.v;if(value==null||String(value).trim()==='')return;var pos=XLSX.utils.decode_cell(address);if(pos.r>=3&&pos.c<=8)lastRow=Math.max(lastRow,pos.r+1)});var rows=[];for(var row=4;row<=lastRow;row++){var values=[];for(var col=0;col<9;col++){var cell=ws[XLSX.utils.encode_cell({r:row-1,c:col})]||{},value=cell.w!==undefined?cell.w:cell.v;values.push(value==null?'':value)}rows.push(values)}return rows}
function readUpload(file){
  parsedItems=[];parseErrors=[];uploadedFileName=file?file.name:'';originalFile=null;renderPreview();if(!file)return;
  if(!document.getElementById('requestType').value){setMessage('요청 유형을 먼저 선택하세요.','error');resetUpload();return}
  if(document.getElementById('requestType').value!=='2P Lite 전환'&&!crawlModeSelected()){setMessage('3P 자료 준비 방식을 먼저 선택하세요.','error');resetUpload();return}
  if(crawlRequired()){originalFile={name:file.name,mimeType:file.type||'application/octet-stream'};renderPreview();return}
  var reader=new FileReader();reader.onload=function(e){try{if(typeof XLSX==='undefined')throw new Error('엑셀 모듈을 불러오지 못했습니다.');originalFile={name:file.name,mimeType:file.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};var wb=XLSX.read(e.target.result,{type:'array',raw:false}),is2P=document.getElementById('requestType').value==='2P Lite 전환',name=is2P&&wb.SheetNames.indexOf('data')>=0?'data':(wb.SheetNames.indexOf('요청 목록')>=0?'요청 목록':(wb.SheetNames.indexOf('입력')>=0?'입력':wb.SheetNames[0])),ws=wb.Sheets[name],headerRow=findUploadHeaderRow(ws);var rows=is2P?readTwoPUploadRows(ws):XLSX.utils.sheet_to_json(ws,{range:headerRow,defval:'',raw:false});parseRows(rows);renderPreview()}catch(err){parseErrors=[err.message||String(err)];renderPreview()}};reader.onerror=function(){parseErrors=['파일을 읽지 못했습니다.'];renderPreview()};reader.readAsArrayBuffer(file)
}
function parseRows(rows){
  var type=document.getElementById('requestType').value;
  if(crawlRequired()){parsedItems=[];return}
  rows.filter(function(r){return Object.keys(r).some(function(k){return String(r[k]).trim()!==''})}).forEach(function(row,index){
    if(type==='2P Lite 전환'){
      var item={vendorProductId:row[0],productId:row[1],option3pId:row[2],barcode:row[4],vendorProductCode:row[5],coupangDisplayName:row[6],vendorRegisteredName:row[7],registeredOptionName:row[8]};Object.keys(item).forEach(function(k){item[k]=String(item[k]==null?'':item[k]).trim()});
      if(!item.vendorProductId&&!item.productId){parseErrors.push((index+4)+'행: 업체상품ID 또는 Product ID 필요');return}
      parsedItems.push(item);return;
    }
    var base={productCode:String(headerValue(row,'품번')).trim(),productName:String(headerValue(row,'등록상품명')).trim(),salePrice:priceText(headerValue(row,'판매가')),discountPrice:priceText(headerValue(row,'정상가'))};
    var sizeValue=headerValue(row,'사이즈')||headerValue(row,'사이즈(쉼표 구분)')||headerValue(row,'사이즈(구분)'),colorValue=headerValue(row,'색상')||headerValue(row,'색상(쉼표 구분)')||headerValue(row,'색상(구분)');var sizes=splitOptions(sizeValue),colors=splitOptions(colorValue);
    if(!base.productCode||!base.productName||!sizes.length||!colors.length||base.salePrice===''||base.discountPrice===''){parseErrors.push((index+2)+'행: 필수값 누락');return}
    sizes.forEach(function(size){colors.forEach(function(color){parsedItems.push({productCode:base.productCode,productName:base.productName,size:size,color:color,salePrice:base.salePrice,discountPrice:base.discountPrice})})});
  })
}
function renderPreview(){var s=schema(),head=document.getElementById('previewHead');document.getElementById('previewWrap').style.display=crawlRequired()?'none':'';head.innerHTML='<th>#</th>'+s.map(function(x){return '<th>'+x[1]+'</th>'}).join('');document.getElementById('summary').textContent=uploadedFileName?(crawlRequired()?uploadedFileName+' · 크롤링 원본 접수 · Total VI 미확정':uploadedFileName+' · '+parsedItems.length+'개 작업 인식 · 오류 '+parseErrors.length+'개 · Total VI '+parsedItems.length):'업로드한 파일이 없습니다.';var body=document.getElementById('previewBody');body.innerHTML='';if(!parsedItems.length)body.innerHTML='<tr><td colspan="'+(s.length+1)+'">미리보기 없음</td></tr>';else parsedItems.slice(0,20).forEach(function(item,n){var tr=document.createElement('tr');var vals=[n+1].concat(s.map(function(x){return item[x[0]]}));vals.forEach(function(v){var td=document.createElement('td');td.textContent=v;tr.appendChild(td)});body.appendChild(tr)});if(parseErrors.length)setMessage(parseErrors.slice(0,5).join(' / '),'error');else setMessage('','');updateSubmitState()}
function exceedsNewRequestViLimit(){return !crawlRequired()&&parsedItems.length>1100}
function updateSubmitState(){var overLimit=exceedsNewRequestViLimit(),limitMessage=document.getElementById('viLimitMessage');limitMessage.textContent=overLimit?'총 VI가 1,100개를 초과하여 요청을 등록할 수 없습니다.\n요청을 1,100 VI 이하로 나누어 등록해 주세요.':'';limitMessage.className=overLimit?'message error':'message';var is2P=document.getElementById('requestType').value==='2P Lite 전환',needsChoice=!is2P&&!crawlModeSelected(),hasData=crawlRequired()?!!originalFile:parsedItems.length>0,node=document.getElementById('node').value,brand=document.getElementById('brand').value,aCodeRequired=(A_CODES_BY_NODE[node]||[]).length>0,brandSelected=!!SELECTED_BRAND&&brand===SELECTED_BRAND;document.getElementById('submitButton').disabled=!document.getElementById('requester').value.trim()||!brandSelected||!document.getElementById('requestType').value||!node||(aCodeRequired&&!document.getElementById('aCode').value)||(!is2P&&!document.getElementById('source').value.trim())||needsChoice||!hasData||!originalFile||parseErrors.length>0||overLimit}
function renderBrandOptions(){var q=document.getElementById('brand').value.trim().toLowerCase(),box=document.getElementById('brandOptions'),matches=BRANDS.filter(function(v){return !q||v.toLowerCase().indexOf(q)>=0});box.innerHTML='';if(!matches.length){box.innerHTML='<div class="combo-empty">CONFIG에서 일치하는 브랜드가 없습니다.</div>';return}matches.slice(0,100).forEach(function(v){var row=document.createElement('div');row.className='combo-option';row.textContent=v;row.onclick=function(){selectBrand(v)};box.appendChild(row)})}
function openBrandMenu(){renderBrandOptions();document.getElementById('brandMenu').classList.add('open')}
function selectBrand(value){SELECTED_BRAND=value;document.getElementById('brand').value=value;document.getElementById('brandMenu').classList.remove('open');updateSubmitState()}
function clearBrandSelection(){SELECTED_BRAND='';openBrandMenu();updateSubmitState()}
function populateACodes(){var node=document.getElementById('node').value,codes=A_CODES_BY_NODE[node]||[],a=document.getElementById('aCode');a.innerHTML='';var first=document.createElement('option');first.value='';first.textContent=node?(codes.length?'A코드 선택':'등록된 A코드 없음'):'Node를 먼저 선택하세요';a.appendChild(first);codes.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;a.appendChild(o)});a.disabled=!node||!codes.length;updateSubmitState()}
function loadConfig(){google.script.run.withSuccessHandler(function(data){A_CODES_BY_NODE=data.aCodesByNode||{};BRANDS=data.brands||[];renderBrandOptions();var n=document.getElementById('node');n.innerHTML='<option value="">Node 선택</option>';(data.nodes||[]).forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;n.appendChild(o)});var p=document.getElementById('priority');p.innerHTML='';(data.priorities||['HIGH','NORMAL','LOW']).forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;if(v==='NORMAL')o.selected=true;p.appendChild(o)});populateACodes()}).withFailureHandler(function(e){setMessage(e.message||String(e),'error')}).getCombinedIntakeBootstrapData()}
function compactItemsForSubmit(){if(document.getElementById('requestType').value==='2P Lite 전환')return parsedItems.map(function(x){return [x.vendorProductId,x.productId,x.option3pId,x.barcode,x.vendorProductCode,x.coupangDisplayName,x.vendorRegisteredName,x.registeredOptionName]});return parsedItems.map(function(x){return [x.productCode,x.productName,x.size,x.color,x.salePrice,x.discountPrice]})}
function newSubmissionId(){var random='';if(window.crypto&&window.crypto.getRandomValues){var bytes=new Uint8Array(12);window.crypto.getRandomValues(bytes);random=Array.from(bytes).map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('')}else random=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);return 'SUB-'+Date.now().toString(36)+'-'+random}
function startPresentationFinalize(submissionId,attempt){google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(error){if(attempt<2)setTimeout(function(){startPresentationFinalize(submissionId,attempt+1)},1500);else console.error(error)}).finalizeCombinedListingPresentationV1(submissionId)}
function finishCombinedSubmit(r,payload){var successMessage=r.crawlRequired===true?'요청 '+r.requestId+'이 생성되었습니다.':'요청 '+r.requestId+'와 Task '+r.createdCount+'개가 생성되었습니다.';['requester','source','notes'].forEach(function(id){document.getElementById(id).value=''});SELECTED_BRAND='';document.getElementById('brand').value='';document.getElementById('node').value='';document.getElementById('requestType').value='';populateACodes();updateRequestTypeUi();parsedItems=[];parseErrors=[];uploadedFileName='';resetUpload();document.getElementById('submitButton').textContent='요청 + Task 생성';setMessage(successMessage,'success');startPresentationFinalize(payload.submissionId,1)}
function resolveFailedSubmission(payload,attempt,originalError){var btn=document.getElementById('submitButton');setMessage('서버 응답이 끊겨 실제 등록 결과를 확인하고 있습니다...','error');google.script.run.withSuccessHandler(function(result){if(result.state==='COMPLETE'){finishCombinedSubmit(result,payload);return}btn.textContent='요청 + Task 생성';updateSubmitState();if(result.state==='ROLLED_BACK_PARTIAL')setMessage('일부만 저장된 요청을 안전하게 취소했습니다. 다시 등록해주세요.','error');else setMessage((originalError&&originalError.message)||'요청이 등록되지 않았습니다. 다시 시도해주세요.','error')}).withFailureHandler(function(error){if(attempt<3){setTimeout(function(){resolveFailedSubmission(payload,attempt+1,originalError)},1500);return}btn.textContent='요청 + Task 생성';updateSubmitState();setMessage('등록 결과 자동 확인에 실패했습니다. 잠시 후 다시 시도해주세요: '+(error.message||String(error)),'error')}).resolveCombinedListingSubmissionV1(payload.submissionId)}
function sendCombinedSubmit(payload){var btn=document.getElementById('submitButton'),wire={};Object.keys(payload).forEach(function(key){if(key!=='originalFile')wire[key]=payload[key]});document.getElementById('payloadJson').value=JSON.stringify(wire);btn.disabled=true;btn.textContent='등록 중...';google.script.run.withSuccessHandler(function(r){if(r&&r.state==='ROLLED_BACK_PARTIAL'){btn.textContent='요청 + Task 생성';updateSubmitState();setMessage('일부만 저장된 요청을 안전하게 취소했습니다. 다시 등록해주세요.','error');return}if(!r||r.ok!==true){btn.textContent='요청 + Task 생성';updateSubmitState();setMessage('요청이 생성되지 않았습니다. 입력값을 확인한 뒤 다시 시도해주세요.','error');return}finishCombinedSubmit(r,payload)}).withFailureHandler(function(error){resolveFailedSubmission(payload,1,error)}).submitCombinedListingRequestFormV1(document.getElementById('intakeForm'))}
function submitAll(){updateSubmitState();if(document.getElementById('submitButton').disabled)return;var payload={submissionId:newSubmissionId(),requester:document.getElementById('requester').value.trim(),brand:SELECTED_BRAND,priority:document.getElementById('priority').value,requestType:document.getElementById('requestType').value,node:document.getElementById('node').value,aCode:document.getElementById('aCode').value,source:document.getElementById('source').value.trim(),notes:document.getElementById('notes').value.trim(),items:compactItemsForSubmit(),originalFile:originalFile};sendCombinedSubmit(payload)}
['requester','source'].forEach(function(id){document.getElementById(id).addEventListener('input',updateSubmitState)});document.getElementById('brand').addEventListener('focus',openBrandMenu);document.getElementById('brand').addEventListener('input',clearBrandSelection);document.addEventListener('click',function(e){if(!document.getElementById('brandCombo').contains(e.target))document.getElementById('brandMenu').classList.remove('open')});document.getElementById('node').addEventListener('change',populateACodes);document.getElementById('aCode').addEventListener('change',updateSubmitState);document.getElementById('requestType').addEventListener('change',function(){updateRequestTypeUi();resetUpload()});document.querySelectorAll('input[name="templateType"]').forEach(function(el){el.addEventListener('change',resetUpload)});document.querySelectorAll('input[name="templateFamily"]').forEach(function(el){el.addEventListener('change',updateTemplateFamilyUi)});document.getElementById('fileInput').addEventListener('change',function(e){readUpload(e.target.files[0])});updateTemplateFamilyUi();updateRequestTypeUi();loadConfig();renderPreview();
