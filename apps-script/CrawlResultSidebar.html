<!DOCTYPE html><html><head><base target="_top"><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;color:#172033;font:13px Arial,sans-serif}h1{margin:0 0 5px;color:#4f3768}.sub{margin:0 0 16px;color:#64748b}.box{margin-bottom:13px;padding:13px;border:1px solid #d7dee8;border-radius:8px}label{display:block;margin-bottom:5px;font-weight:700}select,input{width:100%;height:39px;margin-bottom:10px;padding:8px;border:1px solid #cbd5e1;border-radius:6px}.msg{margin:10px 0;padding:9px;background:#f1f5f9;border-radius:6px}.err{color:#991b1b;background:#fee2e2}button{width:100%;padding:11px;border:0;border-radius:7px;color:#fff;background:#6b4f8a;font-weight:800;cursor:pointer}button.secondary{margin-bottom:12px;color:#6b4f8a;background:#fff;border:1px solid #6b4f8a}button:disabled{opacity:.45}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:6px;border-bottom:1px solid #e5e7eb;text-align:left}.preview{max-height:260px;overflow:auto}</style></head><body>
<h1>크롤링 결과 등록</h1><p class="sub">기존 3P 표준양식으로 정리한 결과를 VI 단위로 등록합니다.</p>
<div class="box"><label>크롤링 요청 *</label><select id="request"><option value="">불러오는 중...</option></select><label>크롤링 작업자 *</label><select id="worker"><option value="">불러오는 중...</option></select></div>
<div class="box"><button type="button" class="secondary" onclick="downloadTemplate()">3P 표준양식 다운로드 (.xlsx)</button><label>크롤링 결과 원본 파일 *</label><input id="file" type="file" accept=".xlsx,.xls,.csv,.tsv"><div id="summary" class="msg">파일을 선택하세요.</div><div class="preview"><table><thead><tr><th>#</th><th>품번</th><th>상품명</th><th>사이즈</th><th>색상</th><th>판매가</th><th>정상가</th></tr></thead><tbody id="body"></tbody></table></div></div>
<button id="submit" disabled onclick="submitResult()">크롤링 결과 등록</button>
<script>
var ITEMS=[],FILE=null,ERRORS=[];
function value(row,names){var keys=Object.keys(row);for(var i=0;i<keys.length;i++){var k=String(keys[i]).replace(/\s/g,'').toLowerCase();for(var j=0;j<names.length;j++)if(k===names[j].replace(/\s/g,'').toLowerCase())return row[keys[i]]}return ''}
function findThreePHeaderRow(ws){var grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});for(var i=0;i<Math.min(grid.length,30);i++){var labels=grid[i].map(function(v){return String(v||'').replace(/\s/g,'').toLowerCase()});if(['품번','등록상품명','사이즈','색상','판매가','정상가'].every(function(v){return labels.indexOf(v)>=0}))return i}throw new Error('요청 목록에서 필수 헤더 행을 찾지 못했습니다.')}
function split(v){return String(v==null?'':v).split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean)}
function priceText(v){return String(v==null?'':v).trim()}
function escapeCell(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){document.getElementById('summary').className='msg'+(ERRORS.length?' err':'');document.getElementById('summary').textContent=FILE?(FILE.name+' · '+ITEMS.length+' VI · 오류 '+ERRORS.length):(ERRORS[0]||'파일을 선택하세요.');document.getElementById('body').innerHTML=ITEMS.slice(0,30).map(function(x,i){return '<tr><td>'+(i+1)+'</td><td>'+escapeCell(x.productCode)+'</td><td>'+escapeCell(x.productName)+'</td><td>'+escapeCell(x.size)+'</td><td>'+escapeCell(x.color)+'</td><td>'+escapeCell(x.salePrice)+'</td><td>'+escapeCell(x.discountPrice)+'</td></tr>'}).join('');document.getElementById('submit').disabled=!document.getElementById('request').value||!document.getElementById('worker').value||!FILE||!ITEMS.length||ERRORS.length>0}
document.getElementById('request').onchange=render;
document.getElementById('worker').onchange=render;
function downloadTemplate(){google.script.run.withSuccessHandler(downloadBase64Template).withFailureHandler(function(e){ERRORS=[e.message||String(e)];render()}).getThreePTemplateDownloadV2()}
function downloadBase64Template(file){var binary=atob(file.base64),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);var url=URL.createObjectURL(new Blob([bytes],{type:file.mimeType})),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
document.getElementById('file').onchange=function(e){var f=e.target.files[0];ITEMS=[];ERRORS=[];FILE=null;if(!f){render();return}var r=new FileReader();r.onload=function(ev){try{var bytes=new Uint8Array(ev.target.result),s='',c=32768;for(var i=0;i<bytes.length;i+=c)s+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+c,bytes.length)));FILE={name:f.name,mimeType:f.type||'application/octet-stream',base64:btoa(s)};var wb=XLSX.read(ev.target.result,{type:'array',raw:false}),sn=wb.SheetNames.indexOf('요청 목록')>=0?'요청 목록':wb.SheetNames[0],ws=wb.Sheets[sn],headerRow=findThreePHeaderRow(ws),rows=XLSX.utils.sheet_to_json(ws,{range:headerRow,defval:'',raw:false});rows.forEach(function(row,idx){var pc=String(value(row,['품번'])).trim(),pn=String(value(row,['등록상품명'])).trim(),sizes=split(value(row,['사이즈','사이즈(쉼표 구분)'])),colors=split(value(row,['색상','색상(쉼표 구분)'])),sp=priceText(value(row,['판매가'])),dp=priceText(value(row,['정상가']));if(!pc&&!pn&&!sizes.length&&!colors.length&&!sp&&!dp)return;if(!pc||!pn||!sizes.length||!colors.length||sp===''||dp===''){ERRORS.push((headerRow+idx+2)+'행 필수값 누락');return}sizes.forEach(function(sz){colors.forEach(function(co){ITEMS.push({productCode:pc,productName:pn,size:sz,color:co,salePrice:sp,discountPrice:dp})})})});render()}catch(err){ERRORS=[err.message||String(err)];render()}};r.readAsArrayBuffer(f)};
function submitResult(){var b=document.getElementById('submit');b.disabled=true;b.textContent='저장 중...';var compact=ITEMS.map(function(x){return [x.productCode,x.productName,x.size,x.color,x.salePrice,x.discountPrice]});google.script.run.withSuccessHandler(function(x){if(!x||x.ok!==true){b.textContent='크롤링 결과 등록';render();ERRORS=['크롤링 결과를 등록하지 못했습니다. 입력 내용을 확인해 주세요.'];render();return}document.getElementById('summary').className='msg';document.getElementById('summary').textContent=x.requestId+' · '+x.createdCount+' VI 등록 완료';b.textContent='등록 완료';google.script.run.withFailureHandler(function(e){console.error(e)}).refreshAllViews()}).withFailureHandler(function(e){ERRORS=[e.message||String(e)];b.textContent='크롤링 결과 등록';render()}).submitCrawlResult({requestId:document.getElementById('request').value,worker:document.getElementById('worker').value,items:compact,originalFile:FILE})}
google.script.run.withSuccessHandler(function(data){var s=document.getElementById('request');s.innerHTML='<option value="">요청 선택</option>';(data.requests||[]).forEach(function(x){var o=document.createElement('option');o.value=x.requestId;o.textContent=x.requestId+' · '+x.brand+' · '+x.requestType+' · '+x.requestor;s.appendChild(o)});var w=document.getElementById('worker');w.innerHTML='<option value="">작업자 선택</option>';(data.workers||[]).forEach(function(name){var o=document.createElement('option');o.value=name;o.textContent=name;w.appendChild(o)});if(data.defaultRequest)s.value=data.defaultRequest;if(data.defaultWorker)w.value=data.defaultWorker;render()}).withFailureHandler(function(e){ERRORS=[e.message||String(e)];render()}).getCrawlResultBootstrapData();render();
</script></body></html>
