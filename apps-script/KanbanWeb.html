<!DOCTYPE html><html lang="ko"><head><base target="_top"><meta charset="UTF-8"><style>
:root{--navy:#14213d;--blue:#2563eb;--bg:#f4f6fa;--line:#e3e8f0;--muted:#697386;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:white;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:16px}.logo{font-size:21px;font-weight:800}.pill{font-size:11px;background:#dbeafe;color:#1d4ed8;padding:5px 8px;border-radius:99px}.nav{display:flex;gap:6px;margin-left:22px}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:700;color:var(--muted)}.nav button.active{background:var(--navy);color:white}.sync{margin-left:auto;font-size:12px;color:var(--muted)}.primary,.secondary{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);color:white}.secondary{background:#e8edf5;color:#25324b}main{padding:20px;max-width:1800px;margin:auto}.view{display:none}.view.active{display:block}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi,.panel{background:white;border:1px solid var(--line);border-radius:15px}.kpi{padding:15px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:25px;margin-top:4px}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;padding:11px;margin-bottom:14px}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:white}.board{display:grid;grid-template-columns:repeat(4,minmax(270px,1fr));gap:12px;overflow-x:auto}.col{background:#e9edf4;border-radius:16px;padding:11px;min-height:380px}.colhead{font-weight:800;padding:4px 3px 11px;display:flex}.count{margin-left:auto;background:white;border-radius:99px;padding:2px 7px;font-size:12px}.cards{display:grid;gap:9px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:0 2px 8px #12203a0d}.card:hover{border-color:#9bb6e7}.cardtop{display:flex;gap:8px}.rid{font-size:12px;font-weight:800}.priority{margin-left:auto;font-size:10px;background:#edf1f6;padding:4px 6px;border-radius:6px}.brand{font-size:16px;font-weight:800;margin:9px 0}.meta{font-size:12px;color:var(--muted);line-height:1.7}.ptype{display:inline-block;font-size:10px;font-weight:700;color:#1d4ed8;background:#dbeafe;padding:4px 7px;border-radius:7px;margin-bottom:7px}.proglabel{display:flex;justify-content:space-between;font-size:11px;margin-top:9px;color:#536078}.bar{height:6px;background:#edf0f5;border-radius:8px;margin-top:9px;overflow:hidden}.bar i{height:100%;display:block;background:var(--blue)}.open{margin-top:10px;width:100%;border:0;background:#edf4ff;color:#1d4ed8;border-radius:8px;padding:8px;font-weight:700}.form{max-width:1050px;padding:22px}.form h2,.detail h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}.wide{grid-column:1/-1}.paste{height:180px;font-family:Consolas,monospace;white-space:pre}.hint{font-size:12px;color:var(--muted);line-height:1.6}.actions{margin-top:16px;display:flex;gap:8px}.message{padding:10px 12px;border-radius:9px;margin-top:12px;display:none}.message.ok{display:block;background:#dcfce7;color:#166534}.message.err{display:block;background:#fee2e2;color:#991b1b}.detail{padding:20px}.detailhead{display:flex;gap:12px;align-items:flex-start}.detailhead .close{margin-left:auto}.editrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;margin:15px 0}.editrow select{border:1px solid var(--line);border-radius:9px;padding:10px}.tablewrap{overflow:auto}.sheettools{display:flex;align-items:center;gap:10px;margin:16px 0 8px}.sheettools span{font-size:12px;color:var(--muted)}.sheettools button{margin-left:auto}.tasks{width:100%;border-collapse:collapse;font-size:12px;background:white;user-select:text}.tasks th,.tasks td{padding:9px;border:1px solid #cfd6e2;text-align:left;white-space:nowrap}.tasks th{position:sticky;top:0;background:#eaf0f8;font-weight:800}.tasks tbody tr:nth-child(even){background:#f8fafc}.tasks td:not(:first-child){min-width:90px}.empty{text-align:center;color:var(--muted);padding:35px}.loading{padding:60px;text-align:center;color:var(--muted)}.choicebackdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:#14213d66}.choicebackdrop.hidden{display:none}.choicebox{width:min(360px,100%);padding:20px;border-radius:14px;background:#fff;box-shadow:0 20px 55px #14213d45}.choicebox h2{margin:0 0 9px}.choicebox p{margin:0;color:var(--muted);line-height:1.6}.choiceactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.choiceactions button{border:0;border-radius:9px;padding:10px;font-weight:700}.choiceactions .cancel{grid-column:1/-1}@media(max-width:800px){.top{flex-wrap:wrap}.nav{order:3;margin:0;width:100%}.sync{display:none}.kpis{grid-template-columns:1fr 1fr}.filters,.grid,.editrow{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,285px)}}
</style></head><body>
<header class="top"><div class="logo">Listing Ops</div><span class="pill">Web Workspace</span><nav class="nav"><button id="navBoard" class="active" onclick="showView('board')">Kanban</button><button id="navCreate" onclick="showView('create')">새 요청 등록</button></nav><span id="sync" class="sync">불러오는 중…</span><button class="secondary" onclick="loadAll()">새로고침</button></header>
<main>
<section id="boardView" class="view active"><div id="kpis" class="kpis"></div><div class="panel filters"><input id="search" placeholder="요청번호, 브랜드, 요청자 검색" oninput="renderBoard()"><select id="fBrand" onchange="renderBoard()"><option value="">모든 브랜드</option></select><select id="fWorker" onchange="renderBoard()"><option value="">모든 담당자</option></select><select id="fPriority" onchange="renderBoard()"><option value="">모든 우선순위</option></select><select id="fNode" onchange="renderBoard()"><option value="">모든 Node</option></select></div><div id="board" class="loading">데이터를 불러오고 있습니다.</div></section>
<section id="createView" class="view"><div class="panel form"><h2>신규 Listing 요청</h2><p class="hint">요청 정보와 상품 목록을 한 번에 등록합니다. 담당자는 등록 후 요청 상세에서 지정합니다.</p><div class="grid"><div class="field"><label>요청자 *</label><input id="requester"></div><div class="field"><label>브랜드 *</label><select id="brand"></select></div><div class="field"><label>우선순위 *</label><select id="priority"></select></div><div class="field"><label>요청 유형 *</label><select id="requestType"></select></div><div class="field"><label>Node *</label><input id="node" placeholder="예: Node A"></div><div class="field"><label>메모</label><input id="notes"></div><div class="field wide"><label>상품 데이터 붙여넣기 *</label><textarea id="paste" class="paste" placeholder="품번&#9;등록상품명&#9;사이즈&#9;색상&#9;판매가&#9;할인가"></textarea><div class="hint">Excel/Sheets에서 6개 열을 순서대로 복사해 붙여넣으세요. 첫 행이 제목이면 자동으로 제외합니다.</div></div></div><div class="actions"><button id="submitBtn" class="primary" onclick="submitRequest()">요청 및 Task 등록</button><button class="secondary" onclick="clearForm()">입력 초기화</button></div><div id="formMsg" class="message"></div></div></section>
<section id="detailView" class="view"><div class="panel detail"><div class="detailhead"><div><h2 id="detailId"></h2><div id="detailMeta" class="hint"></div></div><button class="secondary close" onclick="showView('board')">Kanban으로</button></div><div class="editrow"><select id="detailRequestType"></select><select id="detailAssignee"></select><select id="detailStatus"></select><button class="primary" onclick="saveRequest()">담당자·상태 저장</button></div><div id="detailMsg" class="message"></div><div class="sheettools"><b>Task 작업표</b><span>셀을 드래그해 직접 복사하거나 전체 복사를 사용하세요.</span><button class="secondary" onclick="copyDetailTable()">헤더 포함 전체 복사</button></div><div class="tablewrap"><table class="tasks"><thead><tr><th>작업 상태</th><th>Task ID</th><th>품번</th><th>등록상품명</th><th>사이즈</th><th>색상</th><th>판매가</th><th>할인가</th><th>시작</th><th>완료</th></tr></thead><tbody id="taskBody"></tbody></table></div></div></section>
</main><div id="barcodePrompt" class="choicebackdrop hidden" role="dialog" aria-modal="true" aria-labelledby="barcodePromptTitle"><div class="choicebox"><h2 id="barcodePromptTitle">바코드 제공 여부</h2><p>2P 작업 완료 시점에 요청자로부터 바코드를 제공받았나요?</p><div class="choiceactions"><button id="barcodeYes" class="primary" onclick="answerBarcodeProvided('YES')">제공됨</button><button class="secondary" onclick="answerBarcodeProvided('NO')">미제공</button><button class="secondary cancel" onclick="answerBarcodeProvided('')">취소</button></div></div></div><script>
var DB={requests:[],tasks:[],config:{}};var selectedId='',BARCODE_INTENT=null;var COLS=[['TO DO','TO DO'],['ONGOING','ONGOING'],['ON HOLD','ON HOLD'],['DONE','DONE']];
function rpc(name,args,ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(fail||showError);if(args===undefined)r[name]();else r[name](args)}
function loadAll(after){google.script.run.withSuccessHandler(function(data){DB=data;document.getElementById('sync').textContent='업데이트 '+data.generatedAt+' · 30초 자동';setupSelects();renderBoard();if(selectedId&&document.getElementById('detailView').classList.contains('active'))openDetail(selectedId);if(after)after()}).withFailureHandler(showError).getOperationsWebData()}
function barcodeProvidedValue(value){value=String(value==null?'':value).trim().toUpperCase();return value==='YES'||value==='NO'?value:''}
function barcodeProvidedLabel(value){value=barcodeProvidedValue(value);return value==='YES'?'제공됨':value==='NO'?'미제공':'미확인'}
function setupSelects(){fill('fBrand',DB.config.brands,true);fill('fWorker',DB.config.workers,true);fill('fPriority',DB.config.priorities,true);fill('fNode',DB.config.nodes||[],true);fill('brand',DB.config.brands,false);fill('priority',DB.config.priorities,false);fill('requestType',DB.config.requestTypes,false)}
function fill(id,values,keep){var s=document.getElementById(id),v=keep?s.value:'';var first=keep?s.options[0].outerHTML:'';s.innerHTML=first;(values||[]).forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o)});if(v)s.value=v}
function showView(name){['board','create','detail'].forEach(function(v){document.getElementById(v+'View').classList.toggle('active',v===name)});document.getElementById('navBoard').classList.toggle('active',name==='board'||name==='detail');document.getElementById('navCreate').classList.toggle('active',name==='create')}
function filtered(){var q=document.getElementById('search').value.toLowerCase(),b=document.getElementById('fBrand').value,w=document.getElementById('fWorker').value,p=document.getElementById('fPriority').value,n=document.getElementById('fNode').value;return DB.requests.filter(function(r){return(!q||[r.requestId,r.brand,r.requester,r.assignee].join(' ').toLowerCase().indexOf(q)>-1)&&(!b||r.brand===b)&&(!w||r.assignee===w)&&(!p||r.priority===p)&&(!n||r.node===n)})}
function renderBoard(){var rows=filtered(),board=document.getElementById('board');board.className='board';board.textContent='';renderKpis(rows);COLS.forEach(function(c){var list=rows.filter(function(r){return r.status===c[0]}),col=el('section','col'),h=el('div','colhead');h.append(document.createTextNode(c[1]),textEl('span','count',list.length));col.appendChild(h);var cards=el('div','cards');if(!list.length)cards.appendChild(textEl('div','empty','요청 없음'));list.forEach(function(r){cards.appendChild(card(r))});col.appendChild(cards);board.appendChild(col)})}
function renderKpis(rows){var vals=[['전체',rows.length],['TO DO',rows.filter(x=>x.status==='TO DO').length],['ONGOING',rows.filter(x=>x.status==='ONGOING').length],['DONE',rows.filter(x=>x.status==='DONE').length]],w=document.getElementById('kpis');w.textContent='';vals.forEach(function(v){var d=el('div','kpi');d.append(textEl('span','',v[0]),textEl('b','',v[1]));w.appendChild(d)})}
function card(r){var d=el('article','card'),top=el('div','cardtop');top.append(textEl('span','rid',r.requestId),textEl('span','priority',r.priority||'-'));d.append(top,textEl('div','brand',r.brand||'브랜드 없음'),textEl('span','ptype',r.requestType||'요청 유형 미지정'),textEl('div','meta','요청자 '+(r.requester||'-')+' · 담당자 '+(r.assignee||'미배정')+' · Node '+(r.node||'미지정')));if(r.requestType==='3P Listing')d.appendChild(progressLine('3P Listing',r.completed3P,r.totalVi,'#2563eb'));else if(r.requestType==='2P Lite 전환')d.appendChild(progressLine('2P Lite 전환',r.completed2P,r.totalVi,'#7c3aed'));else if(r.requestType==='3P Listing 후 2P Lite 전환'){d.appendChild(progressLine('3P Listing',r.completed3P,r.totalVi,'#2563eb'));d.appendChild(progressLine('2P Lite 전환',r.completed2P,r.totalVi,'#7c3aed'))}else d.appendChild(progressLine('전체',r.completedVi,r.totalVi,'#64748b'));var b=textEl('button','open','상세 및 작업 열기');b.onclick=function(){openDetail(r.requestId)};d.appendChild(b);return d}
function progressLine(label,done,total,color){var wrap=el('div','progressblock'),head=el('div','proglabel');var pct=total?Math.round(done/total*100):0;head.append(textEl('span','',label+' '+done+' / '+total),textEl('b','',pct+'%'));var bar=el('div','bar'),inner=document.createElement('i');inner.style.width=pct+'%';inner.style.background=color;bar.appendChild(inner);wrap.append(head,bar);return wrap}
function openDetail(id){selectedId=id;var r=DB.requests.find(function(x){return x.requestId===id});if(!r)return;showView('detail');document.getElementById('detailId').textContent=id;document.getElementById('detailMeta').textContent=r.brand+' · '+(r.requestType||'요청 유형 미지정')+' · 요청자 '+r.requester+(r.requestType==='3P Listing'?'':' · 바코드 '+barcodeProvidedLabel(r.barcodeProvided));var rt=document.getElementById('detailRequestType'),a=document.getElementById('detailAssignee'),s=document.getElementById('detailStatus');rt.innerHTML='';DB.config.requestTypes.forEach(function(x){rt.add(new Option(x,x))});a.innerHTML='<option value="">미배정</option>';DB.config.workers.forEach(function(x){a.add(new Option(x,x))});s.innerHTML='';DB.config.statuses.forEach(function(x){s.add(new Option(x,x))});rt.value=r.requestType;a.value=r.assignee;s.value=r.status;var body=document.getElementById('taskBody');body.innerHTML='<tr><td colspan="10" class="empty">이 요청의 Task만 불러오는 중…</td></tr>';google.script.run.withSuccessHandler(function(tasks){DB.tasks=tasks||[];renderDetailTasks()}).withFailureHandler(function(e){body.innerHTML='<tr><td colspan="10" class="empty">Task 로딩 실패: '+e.message+'</td></tr>'}).getRequestTasksFromWeb(id)}
function renderDetailTasks(){var body=document.getElementById('taskBody');body.textContent='';if(!DB.tasks.length){body.innerHTML='<tr><td colspan="10" class="empty">등록된 Task가 없습니다.</td></tr>';return}DB.tasks.forEach(function(t){var tr=document.createElement('tr'),statusSelect=document.createElement('select');var request=DB.requests.find(function(r){return r.requestId===selectedId});var allowedWork=request&&request.requestType==='3P Listing'?['아무것도 안한 상태','3P Listing 완료']:request&&request.requestType==='2P Lite 전환'?['아무것도 안한 상태','2P Lite 전환 완료']:DB.config.workStatuses;allowedWork.forEach(function(x){var option=new Option(x,x);if(request&&request.requestType==='3P Listing 후 2P Lite 전환'&&x==='2P Lite 전환 완료'&&t.workStatus!=='3P Listing 완료'&&t.workStatus!=='2P Lite 전환 완료'){option.disabled=true;option.textContent='2P Lite 전환 완료 (이 행의 3P 완료 후)'}statusSelect.add(option)});statusSelect.value=t.workStatus||'아무것도 안한 상태';statusSelect.onchange=function(){updateTaskStatus(t.taskId,statusSelect.value,statusSelect,t.workStatus||'아무것도 안한 상태')};var td=document.createElement('td');td.appendChild(statusSelect);tr.appendChild(td);[t.taskId,t.productCode,t.productName,t.size,t.color,fmt(t.salePrice),fmt(t.discountPrice),t.startedAt||'-',t.completedAt||'-'].forEach(function(v){tr.appendChild(textEl('td','',v))});body.appendChild(tr)})}
function saveRequest(){var p={requestId:selectedId,requestType:document.getElementById('detailRequestType').value,assignee:document.getElementById('detailAssignee').value,status:document.getElementById('detailStatus').value};google.script.run.withSuccessHandler(function(){msg('detailMsg','저장되었습니다.',true);loadAll()}).withFailureHandler(function(e){msg('detailMsg',e.message,false)}).updateRequestFromWeb(p)}
function showBarcodeProvidedPrompt(intent){BARCODE_INTENT=intent;document.getElementById('barcodePrompt').classList.remove('hidden');document.getElementById('barcodeYes').focus()}
function answerBarcodeProvided(value){var intent=BARCODE_INTENT;BARCODE_INTENT=null;document.getElementById('barcodePrompt').classList.add('hidden');if(!intent)return;if(!value){intent.select.value=intent.previous;return}intent.barcodeProvided=value;runTaskStatusUpdate(intent)}
function runTaskStatusUpdate(intent){intent.select.disabled=true;google.script.run.withSuccessHandler(function(){loadAll()}).withFailureHandler(function(e){intent.select.disabled=false;intent.select.value=intent.previous;msg('detailMsg',e.message,false)}).setTaskWorkStatusFromWeb(intent.id,intent.status,intent.barcodeProvided)}
function updateTaskStatus(id,status,select,previous){var request=DB.requests.find(function(r){return r.requestId===selectedId}),intent={id:id,status:status,select:select,previous:previous,barcodeProvided:barcodeProvidedValue(request&&request.barcodeProvided)};if(status==='2P Lite 전환 완료'&&!intent.barcodeProvided){showBarcodeProvidedPrompt(intent);return}runTaskStatusUpdate(intent)}
function copyDetailTable(){var headers=['작업 상태','Task ID','품번','등록상품명','사이즈','색상','판매가','할인가','시작','완료일'];var rows=DB.tasks.filter(function(t){return t.requestId===selectedId}).map(function(t){return[t.workStatus||'아무것도 안한 상태',t.taskId,t.productCode,t.productName,t.size,t.color,t.salePrice,t.discountPrice,t.startedAt||'',t.completedAt||'']});var text=[headers].concat(rows).map(function(row){return row.map(function(v){return String(v==null?'':v).replace(/\t/g,' ').replace(/\r?\n/g,' ')}).join('\t')}).join('\n');function done(){msg('detailMsg','엑셀 붙여넣기용 표를 클립보드에 복사했습니다.',true)}function fallback(){var area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();done()}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(fallback)}else fallback()}
function parseItems(){var lines=document.getElementById('paste').value.trim().split('\n').filter(Boolean),rows=lines.map(x=>x.split('	'));if(rows.length&&/품번|상품명/.test(rows[0].join(' ')))rows.shift();return rows.map(function(r){return{productCode:r[0]||'',productName:r[1]||'',size:r[2]||'',color:r[3]||'',salePrice:String(r[4]||'').replace(/,/g,''),discountPrice:String(r[5]||'').replace(/,/g,'')}})}
function submitRequest(){var btn=document.getElementById('submitBtn'),p={requester:document.getElementById('requester').value,brand:document.getElementById('brand').value,priority:document.getElementById('priority').value,requestType:document.getElementById('requestType').value,node:document.getElementById('node').value,notes:document.getElementById('notes').value,items:parseItems()};btn.disabled=true;google.script.run.withSuccessHandler(function(res){btn.disabled=false;if(!res||res.ok!==true){msg('formMsg','요청을 등록하지 못했습니다. 입력 내용을 확인해 주세요.',false);return}msg('formMsg',res.requestId+' · Task '+res.createdCount+'개가 등록되었습니다.',true);clearForm(false);loadAll(function(){showView('board')})}).withFailureHandler(function(e){btn.disabled=false;msg('formMsg',e.message,false)}).createListingRequestFromWeb(p)}
function clearForm(clearMsg){['requester','node','notes','paste'].forEach(id=>document.getElementById(id).value='');if(clearMsg!==false)document.getElementById('formMsg').className='message'}
function msg(id,t,ok){var x=document.getElementById(id);x.textContent=t;x.className='message '+(ok?'ok':'err')}function showError(e){alert(e.message||e)}function el(tag,cls){var x=document.createElement(tag);if(cls)x.className=cls;return x}function textEl(tag,cls,t){var x=el(tag,cls);x.textContent=t;return x}function fmt(n){return Number(n||0).toLocaleString('ko-KR')}
document.addEventListener('keydown',function(event){if(event.key==='Escape'&&BARCODE_INTENT){event.preventDefault();answerBarcodeProvided('')}});loadAll();setInterval(function(){if(!BARCODE_INTENT)loadAll()},30000);
</script></body></html>
