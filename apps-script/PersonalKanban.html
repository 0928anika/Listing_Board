<html lang="ko">
<head><base target="_top"><meta charset="utf-8">
<style>

.request-table tbody tr{cursor:pointer}.request-table tbody tr:focus-within{background:#f0f5fc}.check-cell input{vertical-align:middle}.panel-title{padding:11px 12px 7px;flex-shrink:0}.selection-summary{padding:0 12px 8px}.worker-tools{padding:7px 10px}.worker-tools select{max-width:115px}.worker-list{min-height:100px;background:#fff}.worker-row{grid-template-columns:16px minmax(0,1fr) 45px 45px 30px;gap:6px;min-height:38px;padding:8px 10px}.worker-row .worker-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.worker-number{text-align:right;font-variant-numeric:tabular-nums;font-size:10px;color:#566880}.worker-head{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:16px minmax(0,1fr) 45px 45px 30px;gap:6px;padding:6px 10px;background:#f0f3f8;border-bottom:1px solid var(--line);color:#65758c;font-size:9px}.worker-head span:nth-child(n+3){text-align:right}.chosen-workers{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 7px;max-height:62px;overflow:auto;flex-shrink:0}.chosen-workers:empty{display:none}.chosen-workers button{font-size:10px;padding:3px 6px;background:#eaf1fc;border-color:#d4e1f4;color:#345d96}.preview{max-height:125px;min-height:35px;padding:8px 10px}.preview-title{display:flex;align-items:center;justify-content:space-between;font-size:10px;margin-bottom:5px}.preview-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10px}.preview-table th{color:#6b7990;font-weight:400;text-align:right;padding:3px 0}.preview-table th:first-child,.preview-table td:first-child{text-align:left;width:22%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-table td{text-align:right;font-variant-numeric:tabular-nums;padding:5px 0;border-top:1px solid #e8edf5;color:#345d96}.preview-table small{color:#7a879a;font-size:9px}.preview details{margin-top:5px;font-size:10px;color:#77859b}.preview summary{cursor:pointer}.preview .warning{padding:5px;margin-top:5px}.assign-footer{padding:8px 10px}.assign-footer .primary{background:#eaf1fc;border-color:#c6d7ef;color:#365f99}.assign-footer .primary:hover:not(:disabled){background:#dde9fa}.draft-bar{padding:8px 12px}.draft-help:empty{display:none}.draft-list.hidden{display:none}.draft-actions strong{font-size:12px}.draft-actions button{white-space:nowrap}.draft-actions .primary{min-width:150px}.draft-item{padding:5px 0;border-top:1px solid #dfe6f0}.draft-item>button:first-child{color:#365f99;font-weight:700}.results{max-height:70px}.empty{padding:20px 12px}.empty strong{display:block;font-size:13px;color:#61738f;margin-bottom:5px}.empty button{margin-top:9px;font-size:11px}
@media(max-height:650px){.preview{max-height:100px}.worker-list{min-height:80px}.top{padding-top:9px;padding-bottom:8px}.selection-summary{padding-bottom:6px}.panel-title{padding-top:9px}.draft-list{max-height:62px}.draft-actions .primary{height:32px}}
.summary-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.summary-head button{font-size:10px;padding:3px 5px;border:0;color:#46689b;background:transparent}.selection-actions{display:flex;gap:10px;flex-shrink:0}.allocation-method{padding:0 10px 7px;color:#526a89;font-size:10px;line-height:1.5;flex-shrink:0}.worker-identity{display:flex;align-items:center;min-width:0;gap:4px}.worker-identity .worker-name{min-width:0}.worker-recommend{font-size:9px;color:#456b9d;white-space:nowrap;flex-shrink:0}.preview{max-height:170px}.close-confirm{border:1px solid var(--line);border-radius:10px;padding:22px;width:min(390px,calc(100vw - 32px));color:var(--ink);box-shadow:0 12px 40px #23365030}.close-confirm::backdrop{background:#18283f66}.close-confirm h2{font-size:16px;margin:0 0 12px}.close-confirm p{font-size:12px;line-height:1.7;color:#66758c}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.confirm-actions button{min-height:34px}.confirm-actions .primary{width:auto;padding:0 12px}.discard-close{color:#a34646}.close-confirm:not([open]){display:none}.barcode-choice .confirm-actions{display:grid;grid-template-columns:1fr 1fr}.barcode-choice .confirm-actions button{width:100%}.barcode-choice .confirm-actions .barcode-cancel{grid-column:1/-1;color:#68768b}@media(max-height:650px){.preview{max-height:105px}.allocation-method{font-size:9px;padding-bottom:4px}.worker-list{min-height:76px}}
.request-table td.request-notes{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;padding:7px 4px;vertical-align:top}
</style></head>
<body>
<div class="app">
<header class="top">
<div class="headline"><div><span class="title">작업자 배정</span><span class="updated" id="updated">요청 선택 → 배정 대기에 추가 → 최종 저장</span></div><div class="actions"><button id="resetFiltersButton" class="secondary" data-action="reset-filters">필터 초기화</button><button id="refreshButton" class="secondary" data-action="refresh">새로고침</button><button class="secondary" data-action="close-console">닫기</button></div></div>
<div class="toolbar" id="filterToolbar">
<label>작업자<select id="assignee" aria-label="작업자 필터" ></select></label>
<label>브랜드<select id="brand" aria-label="브랜드 필터" ></select></label>
<label>Node<select id="node" aria-label="Node 필터" ></select></label>
<label class="search-label"><input id="search" aria-label="요청 검색" placeholder="Request ID, 요청자, 브랜드, 메모 검색" ></label>
<span class="count" id="count">0 requests</span></div>
</header>
<div class="workspace">
<section class="list-pane" aria-label="요청 목록">
<div class="tabs" id="statusTabs" role="tablist" aria-label="요청 상태"></div>
<div class="selection-bar"><span id="selectionInfo" aria-live="polite">요청을 선택하세요</span><div class="selection-actions"><button id="clearHiddenSelectionButton" data-action="clear-hidden" class="hidden">필터 밖 선택 해제</button><button id="clearSelectionButton" data-action="clear-selection">선택 해제</button></div></div>
<div class="table-scroll" id="requestScroll"><table class="request-table" aria-label="배정할 요청">
<colgroup><col style="width:26px"><col style="width:94px"><col style="width:10%"><col style="width:10%"><col style="width:9%"><col style="width:18%"><col style="width:10%"><col></colgroup>
<thead><tr><th class="check-cell"><input type="checkbox" id="selectAll" aria-label="현재 목록 전체 선택" ></th><th id="idHeading" aria-sort="ascending"><button class="sort-btn" id="sortRequests" data-action="sort-requests">Request ID ↑</button></th><th>브랜드</th><th>작업 유형</th><th>Node</th><th class="numeric">남은 작업량</th><th>담당자</th><th>비고</th></tr></thead>
<tbody id="requestRows"></tbody></table><div class="empty hidden" id="requestEmpty">조건에 맞는 요청이 없습니다.</div></div>
</section>
<aside class="right-pane" aria-label="작업자 선택 및 배정">
<div class="assignment" id="assignmentPanel">
<h2 class="panel-title">작업자 선택</h2>
<div class="selection-summary" id="selectionSummary" aria-live="polite"></div>
<div class="worker-tools" id="workerTools"><input id="workerSearch" aria-label="담당자 검색" placeholder="작업자 찾기" ><select id="workerSort" aria-label="작업자 정렬" title="전체 작업량과 추천은 3P+2P 수량 기준이며 작업시간으로 환산하지 않습니다." ><option value="total">전체 작업량 적은 순</option><option value="workload">3P 적은 순</option><option value="2p">2P 적은 순</option><option value="requests">REQ 적은 순</option><option value="config">기본 순서</option></select></div>
<div class="chosen-workers" id="chosenWorkers" aria-label="선택한 작업자"></div>
<div id="allocationMethod" class="allocation-method hidden" aria-live="polite"></div>
<div class="worker-list" id="workerList" role="group" aria-label="배정할 작업자 (복수 선택)"></div>
<div class="preview hidden" id="preview" aria-live="polite"></div>
<div class="assign-footer"><button id="assignButton" class="primary" disabled data-action="stage">배정할 요청을 선택하세요</button><div class="results hidden" id="batchResults" role="status" aria-live="polite"></div></div>
</div>
<section class="details hidden" id="detailsPanel" aria-label="요청 상세"><button class="back" data-action="close-details">← 배정으로 돌아가기</button><div id="detailContent"></div><div id="activework" class="activework hidden"></div></section>
</aside>
</div>
<section class="draft-bar" aria-label="배정 대기"><div class="draft-actions"><strong id="draftCount">배정 대기 0건</strong><button id="toggleDraftsButton" aria-expanded="false" aria-controls="draftList" data-action="toggle-drafts" disabled>목록 펼치기</button><button id="discardDraftsButton" data-action="discard-drafts" disabled>전체 취소</button><button id="commitButton" class="primary" data-action="commit" disabled>배정 저장</button></div><div class="draft-help" id="draftHelp"></div><div class="draft-list hidden" id="draftList"></div><div id="saveResults" class="results" role="status" aria-live="polite"></div></section>
</div>
<div class="loading" id="loading"><span class="spin"></span>배정 목록을 불러오는 중...</div><div class="toast hidden" id="toast" role="status"></div>
<dialog id="closeConfirm" class="close-confirm" aria-labelledby="closeConfirmTitle" aria-describedby="closeConfirmMessage"><h2 id="closeConfirmTitle">배정을 저장하지 않고 닫을까요?</h2><p id="closeConfirmMessage"></p><div class="confirm-actions"><button class="discard-close" data-action="discard-close">변경사항 버리고 닫기</button><button id="continueEditingButton" class="primary" data-action="continue-edit">계속 편집</button></div></dialog>
<dialog id="barcodePrompt" class="close-confirm barcode-choice" aria-labelledby="barcodePromptTitle" aria-describedby="barcodePromptMessage"><h2 id="barcodePromptTitle">바코드 제공 여부</h2><p id="barcodePromptMessage">2P 작업 시작 시점에 요청자로부터 바코드를 제공받았나요?</p><div class="confirm-actions"><button id="barcodeYes" class="primary" data-action="barcode-answer" data-value="YES">제공됨</button><button data-action="barcode-answer" data-value="NO">미제공</button><button class="barcode-cancel" data-action="barcode-answer" data-value="">취소</button></div></dialog>
<script>
// BEGIN SHARED SESSION CLIENT
// Shared verbatim by MyWorkSidebar and PersonalKanban (no external download).
var SESSION_INFLIGHT=null,SESSION_MAINTENANCE_AT=0;
function sessionStorageKey(){return 'listing-session-v1:'+String(DATA.spreadsheetId||location.pathname)+':'+(typeof ACTION_TARGET==='undefined'?'assignment':'sidebar');}
function sessionStore(command){try{if(command)localStorage.setItem(sessionStorageKey(),JSON.stringify(command));else localStorage.removeItem(sessionStorageKey());}catch(ignored){}}
function sessionNewCommand(command,active){
 command.operationId=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);
 command.issuedAt=Date.now();
 if(command.action==='START')command.expectedActiveSessionId=active&&active.sessionId||'';
 else command.sessionId=active&&active.sessionId||'';
 return command;
}
function sessionRun(command,handlers,recover){
 if(SESSION_INFLIGHT)return;
 var operation={command:command,timer:null,watchdog:null,checking:false,finished:false};SESSION_INFLIGHT=operation;sessionStore(command);
 function current(){return SESSION_INFLIGHT===operation&&!operation.finished;}
 function pending(label){if(current()&&handlers.pending)handlers.pending(label);}
 function schedule(check,delay){if(!current())return;clearTimeout(operation.timer);operation.timer=setTimeout(function(){if(check)query();else send();},delay||700);}
 function finish(result){
  if(!current())return;operation.finished=true;clearTimeout(operation.timer);clearTimeout(operation.watchdog);SESSION_INFLIGHT=null;sessionStore(null);
  if(result.ok&&result.state==='COMMITTED'){
   // This RPC is deliberately independent of the confirmed core result.
   try{google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(){}).finishWorkSessionCommand({operationId:command.operationId});}catch(ignored){}
   handlers.success(result);
  }else handlers.rejected(result);
 }
 function accept(result,fromQuery){
  if(!current())return;
  if(result&&result.ok===true&&result.state==='COMMITTED'&&result.snapshot&&result.sessionId){finish(result);return;}

function sessionFor(requestId,stage,worker){return ((((DATA.workSessions||{}).sessions)||[]).filter(function(s){return s.requestId===requestId&&s.stage===stage&&s.worker===worker;}))[0];}
function workerThreePReady(r,worker){if(r.requestType!=='3P Listing 후 2P Lite 전환')return true;var p=r.workerProgress&&r.workerProgress[worker];return !!p&&num(p.assigned3P)>0&&num(p.done3P)>=num(p.assigned3P);}
function workControls(r){if(UI.preparing)return '<div class="workhint">작업 상태를 확인 중입니다.</div>';if(UI.drafts.size||UI.busy)return '<div class="workhint">담아둔 배정을 저장하거나 취소한 뒤 작업을 시작하세요.</div>';var worker=selectedWorker();if(!worker)return '';if(r.crawlRequired&&r.crawlStage!=='CRAWL_COMPLETED'){if(r.crawlAssignee!==worker)return '<div class="workhint">'+esc(worker)+' 작업자에게 배정된 크롤링 요청이 아닙니다.</div>';var cs=sessionFor(r.requestId,'CRAWL',worker),ca=cs&&cs.status==='ACTIVE';return '<div class="workactions"><button class="workbtn '+(ca?'pause':'')+'" data-action="work" data-id="'+esc(r.requestId)+'" data-stage="CRAWL" data-work-action="'+(ca?'PAUSE':'START')+'">'+(ca?'크롤링 일시중지':(cs?'크롤링 이어서 시작':'크롤링 시작'))+'</button></div>';}if(assigneesOf(r.assignee).indexOf(worker)<0)return '<div class="workhint">'+esc(worker)+' 작업자에게 배정되지 않은 요청입니다.</div>';if(r.status==='DONE')return '<div class="workhint">완료된 요청입니다.</div>';var stages=[];if(r.requestType!=='2P Lite 전환')stages.push('3P');if(r.requestType!=='3P Listing')stages.push('2P');return '<div class="workactions">'+stages.map(function(stage){var s=sessionFor(r.requestId,stage,worker),active=s&&s.status==='ACTIVE',locked=stage==='2P'&&!active&&!workerThreePReady(r,worker);if(locked)return '<button class="workbtn" disabled title="내게 배정된 VALID 3P VI를 모두 완료해야 합니다.">내 3P 완료 후 2P 시작</button>';return '<button class="workbtn '+(active?'pause':'')+'" data-action="work" data-id="'+esc(r.requestId)+'" data-stage="'+stage+'" data-work-action="'+(active?'PAUSE':'START')+'">'+(active?'일시중지':(s?'이어서 '+stage:stage+' 시작'))+'</button>';}).join('')+'</div>';}
function showBarcodeProvidedPrompt(intent){UI.barcodeIntent=intent;byId('barcodePromptMessage').textContent='2P 작업 '+(intent.action==='COMPLETE'?'완료':'시작')+' 시점에 요청자로부터 바코드를 제공받았나요?';var dialog=byId('barcodePrompt');if(!dialog.open)dialog.showModal();byId('barcodeYes').focus();}
function answerBarcodeProvided(value){var intent=UI.barcodeIntent;UI.barcodeIntent=null;var dialog=byId('barcodePrompt');if(dialog.open)dialog.close();if(!intent||!value)return;intent.barcodeProvided=value;runPersonalWork(intent);}
function personalSessionHandlers(command){return {
 pending:function(label){byId('loading').textContent=label;},
 success:function(res){UI.busy=false;DATA.workSessions.sessions=(DATA.workSessions.sessions||[]).filter(function(s){return s.worker!==command.worker;}).concat(res.snapshot.sessions);DATA.workSessions.active=(DATA.workSessions.active||[]).filter(function(s){return s.worker!==command.worker;}).concat(res.snapshot.active);setLoading(false);render();renderActiveWork();notice(command.action==='START'?(res.sessionStatus==='ACTIVE'?'작업을 시작했습니다.':'시작 기록을 확인했습니다. 현재는 중지 상태입니다.'):command.action==='COMPLETE'?'작업 완료를 확인했습니다.':'작업을 일시중지했습니다.');if(command.action==='START'&&res.sessionStatus==='ACTIVE')google.script.run.withSuccessHandler(function(){google.script.host.close();}).withFailureHandler(function(){notice('세션은 시작되었습니다. 작업 시트 이동만 완료하지 못했습니다.');resumePersonalSessionPreparation();}).navigateCommittedSession({operationId:command.operationId});else resumePersonalSessionPreparation();},
 rejected:function(res){UI.busy=false;setLoading(false);if(res.snapshot)DATA.workSessions=res.snapshot;render();renderActiveWork();notice(res.message||'작업 상태를 변경하지 않았습니다.');resumePersonalSessionPreparation();}
};}
function resumePersonalSessionPreparation(){if(DATA.preparationRequired&&!UI.preparing)beginPreparation(loadSequence);}
function restorePersonalSession(){return sessionRestore(function(command){UI.busy=true;byId('loading').textContent='이전 저장 상태 확인 중…';setLoading(true);sessionRun(command,personalSessionHandlers(command),true);});}
function runPersonalWork(intent){if(UI.busy)return;UI.busy=true;byId('loading').textContent=intent.action==='START'?'시작 처리 중…':intent.action==='COMPLETE'?'완료 처리 중…':'중지 처리 중…';setLoading(true);var payload={worker:intent.worker,requestId:intent.requestId,stage:intent.stage,action:intent.action};if(intent.barcodeProvided)payload.barcodeProvided=intent.barcodeProvided;var active=(DATA.workSessions.active||[]).find(function(s){return s.worker===intent.worker;});sessionNewCommand(payload,active);sessionRun(payload,personalSessionHandlers(payload));}
function toggleWork(requestId,stage,action,event){if(UI.preparing)return;if(UI.drafts.size||UI.busy){notice('배정 변경을 먼저 저장하거나 취소하세요.');return;}if(event&&event.preventDefault){event.preventDefault();event.stopPropagation();}var worker=selectedWorker();if(!worker)return alert('작업자를 먼저 선택하세요.');var active=((((DATA.workSessions||{}).active)||[]).filter(function(s){return s.worker===worker&&['CRAWL','3P','2P'].indexOf(s.stage)>=0;}))[0];if(action==='START'&&active&&(active.requestId!==requestId||active.stage!==stage)&&!confirm(active.requestId+' / '+active.stage+' 작업을 일시중지하고 새 작업을 시작할까요?'))return;var r=requestIndex.get(requestId),intent={worker:worker,requestId:requestId,stage:stage,action:action,barcodeProvided:r?barcodeProvidedValue(r.barcodeProvided):''};if(stage==='2P'&&(action==='START'||action==='COMPLETE')&&!intent.barcodeProvided){showBarcodeProvidedPrompt(intent);return;}runPersonalWork(intent);}
initEvents();
load();
</script></body></html>
